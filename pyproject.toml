[project]
name = "lisa"
version = "1.0.0"
description = "GitHub Action that reviews pull requests for unneeded complexity, security issues, and secrets using TypeSafe."
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
