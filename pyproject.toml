[project]
name = "lisa"
version = "1.0.0"
description = "GitHub Action that reviews pull requests for secrets, security vulnerabilities, unneeded complexity, and prompt injection using TypeSafe."
requires-python = ">=3.11"
# Lisa runs on the Python standard library alone. Keep it that way.
dependencies = []

# Development tools only, pinned exactly; uv.lock records their hashes and CI installs with --locked.
[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.9"]

[tool.uv]
package = false
required-version = ">=0.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
