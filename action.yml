name: Lisa
description: Leak, Injection & Simplicity Auditor. Flags secrets, security vulnerabilities, and unneeded complexity in pull requests using TypeSafe.
author: Lisa
branding:
  icon: shield
  color: purple

inputs:
  api-key:
    description: TypeSafe API key (store it as a repository secret).
    required: true
  github-token:
    description: Token used to read the PR diff and post the review comment.
    required: false
    default: ${{ github.token }}
  model:
    description: TypeSafe model to use.
    required: false
    default: jev-latest
  threshold:
    description: Probability (0-1) at which Jev's answer counts as "yes" and fails the PR. Defaults to the threshold in .lisa.yml, or 0.5.
    required: false
    default: ""

outputs:
  findings:
    description: Total number of findings.
    value: ${{ steps.lisa.outputs.findings }}

runs:
  using: composite
  steps:
    # PyYAML reads .lisa.yml. Use the runner's copy if it has one; otherwise install a pinned
    # wheel into a temporary directory, leaving the runner's Python untouched.
    - shell: bash
      run: |
        if ! python3 -c "import yaml" 2>/dev/null; then
          python3 -m pip install --quiet --disable-pip-version-check --only-binary=:all: \
            --target "$RUNNER_TEMP/lisa-python" "PyYAML==6.0.3"
        fi
      env:
        PIP_BREAK_SYSTEM_PACKAGES: "1"
    - id: lisa
      shell: bash
      run: python3 -m lisa
      env:
        PYTHONPATH: ${{ github.action_path }}:${{ runner.temp }}/lisa-python
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
