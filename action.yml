name: Lisa
description: Leak, Injection & Simplicity Auditor. Flags secrets, security vulnerabilities, and unneeded complexity in pull requests using TypeSafe.
author: Lisa
branding:
  icon: shield
  color: purple

inputs:
  api-key:
    description: TypeSafe API key (store it as a repository secret).
    required: true
  github-token:
    description: Token used to read the PR diff and post the review comment.
    required: false
    default: ${{ github.token }}
  model:
    description: TypeSafe model to use.
    required: false
    default: jev-latest
  threshold:
    description: Probability (0-1) at which Jev's answer counts as "yes" and fails the PR. Defaults to the threshold in .lisa.toml, or 0.5.
    required: false
    default: ""

outputs:
  findings:
    description: Total number of findings.
    value: ${{ steps.lisa.outputs.findings }}

runs:
  using: composite
  steps:
    # Lisa uses only the Python standard library. It runs from the action's own directory with
    # PYTHONSAFEPATH and without user site-packages, so nothing in the workspace (which may hold
    # pull request code) can shadow its modules.
    - id: lisa
      shell: bash
      working-directory: ${{ github.action_path }}
      run: python3 -s -m lisa
      env:
        PYTHONPATH: ${{ github.action_path }}
        PYTHONSAFEPATH: "1"
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
