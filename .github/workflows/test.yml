name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uvx ruff check lisa tests
      - run: uvx ruff format --check lisa tests
      - run: uv run --python ${{ matrix.python }} --with pytest --no-project pytest -q
