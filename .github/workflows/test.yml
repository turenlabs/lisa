name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      # Actions are pinned to full commit SHAs; a tag can be moved to different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.7"
      # --locked installs exactly what uv.lock pins, with hash verification, or fails.
      - run: uv run --locked --python ${{ matrix.python }} ruff check lisa tests
      - run: uv run --locked --python ${{ matrix.python }} ruff format --check lisa tests
      - run: uv run --locked --python ${{ matrix.python }} pytest -q
      # Lisa must stay on the standard library alone.
      - name: No runtime dependencies
        run: |
          python3 - <<'EOF'
          import tomllib
          deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
          assert deps == [], f"Lisa must not have runtime dependencies, found {deps}"
          EOF
